services:
  - type: web
    name: life-santos
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: life-santos-db
          property: connectionString
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: STAFF_ROLE_IDS
        sync: false
      - key: PLAYER_ROLE_ID
        sync: false
      - key: ANNOUNCEMENT_CHANNEL_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
  - type: worker
    name: life-santos-bot
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm run bot
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: life-santos-db
          property: connectionString
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: PLAYER_ROLE_ID
        sync: false
      - key: ANNOUNCEMENT_CHANNEL_ID
        sync: false
      - key: STAFF_ROLE_IDS
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: life-santos
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
    # A background worker stays connected to Discord and handles queued announcements.
databases:
  - name: life-santos-db
    plan: free


